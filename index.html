<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mandarin Practice</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mandarin"><style id="css">
:root{--bg:#fdf8f0;--card:#fff;--ink:#2a2420;--mute:#7a6f66;--acc:#d9422b;--ok:#2f8f5b;--line:#e8dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--ink:#f5efe6;--mute:#a8a29e;--acc:#ff7a5c;--ok:#5fcf93;--line:#44403c}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--ink:#f5efe6;--mute:#a8a29e;--acc:#ff7a5c;--ok:#5fcf93;--line:#44403c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
#root{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 14px}
select,button,textarea,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
button{cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row>*{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.big{font-size:4.5rem;line-height:1.1}
.mid{font-size:2rem}
.py{font-size:1.8rem;color:var(--acc);margin-top:10px}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.again{border-color:var(--acc);color:var(--acc)}
.prog{color:var(--mute);font-size:.9rem;margin:10px 0}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--mute)}
textarea{width:100%;box-sizing:border-box;min-height:120px;margin:8px 0}
input{width:100%;box-sizing:border-box}
.sm{font-size:.8rem;color:var(--mute)}
</style></head><body><div id="root"></div><script type="application/json" id="data">{"sets": [{"name": "Set 1 (9/30/26)", "words": [{"h": "上面", "p": "shàng miàn", "e": "above / on top"}, {"h": "不好", "p": "bù hǎo", "e": "not good"}, {"h": "大山", "p": "dà shān", "e": "big mountain"}, {"h": "小马", "p": "xiǎo mǎ", "e": "small horse"}, {"h": "男生", "p": "nán shēng", "e": "boy"}, {"h": "月亮", "p": "yuè liang", "e": "moon"}, {"h": "今天", "p": "jīn tiān", "e": "today"}, {"h": "走路", "p": "zǒu lù", "e": "to walk"}, {"h": "星星", "p": "xīng xing", "e": "star"}, {"h": "下面", "p": "xià miàn", "e": "below"}, {"h": "坐下", "p": "zuò xià", "e": "sit down"}, {"h": "喝水", "p": "hē shuǐ", "e": "drink water"}, {"h": "小牛", "p": "xiǎo niú", "e": "calf"}, {"h": "女生", "p": "nǚ shēng", "e": "girl"}, {"h": "是的", "p": "shì de", "e": "yes"}, {"h": "出去", "p": "chū qù", "e": "go out"}, {"h": "星期", "p": "xīng qī", "e": "week"}, {"h": "大小", "p": "dà xiǎo", "e": "big / small"}, {"h": "现在", "p": "xiàn zài", "e": "now"}, {"h": "大火", "p": "dà huǒ", "e": "big fire"}, {"h": "小羊", "p": "xiǎo yáng", "e": "lamb"}, {"h": "生日", "p": "shēng rì", "e": "birthday"}, {"h": "下雨", "p": "xià yǔ", "e": "rain"}, {"h": "明天", "p": "míng tiān", "e": "tomorrow"}, {"h": "回来", "p": "huí lái", "e": "to come back"}, {"h": "几个", "p": "jǐ ge", "e": "how many"}, {"h": "里面", "p": "lǐ miàn", "e": "inside"}, {"h": "大人", "p": "dà rén", "e": "adult"}, {"h": "小鸟", "p": "xiǎo niǎo", "e": "small bird"}, {"h": "土地", "p": "tǔ dì", "e": "ground"}, {"h": "学生", "p": "xué sheng", "e": "student"}, {"h": "昨天", "p": "zuó tiān", "e": "yesterday"}, {"h": "田地", "p": "tián dì", "e": "farm land"}, {"h": "今年", "p": "jīn nián", "e": "this year"}, {"h": "小虫", "p": "xiǎo chóng", "e": "small bug"}]}, {"name": "Set 2", "words": [{"h": "我们", "p": "wǒ men", "e": "we"}, {"h": "朋友", "p": "péng you", "e": "friend"}, {"h": "不要", "p": "bú yào", "e": "don't want"}, {"h": "喜欢", "p": "xǐ huan", "e": "to like"}, {"h": "上课", "p": "shàng kè", "e": "to have class"}, {"h": "没有", "p": "méi yǒu", "e": "don't have"}, {"h": "送给", "p": "sòng gěi", "e": "to give someone"}, {"h": "学生", "p": "xué sheng", "e": "student"}, {"h": "怎么", "p": "zěn me", "e": "how"}, {"h": "几岁", "p": "jǐ suì", "e": "how old"}, {"h": "你们", "p": "nǐ men", "e": "you (plural)"}, {"h": "上面", "p": "shàng miàn", "e": "above / on top"}, {"h": "看书", "p": "kàn shū", "e": "to read"}, {"h": "妈妈", "p": "mā ma", "e": "mom"}, {"h": "学校", "p": "xué xiào", "e": "school"}, {"h": "是谁", "p": "shì shéi", "e": "who is it"}, {"h": "时间", "p": "shí jiān", "e": "time"}, {"h": "你好", "p": "nǐ hǎo", "e": "hello"}, {"h": "我的", "p": "wǒ de", "e": "my"}, {"h": "他们", "p": "tā men", "e": "they (boys / mixed)"}, {"h": "吃饭", "p": "chī fàn", "e": "to eat"}, {"h": "外面", "p": "wài miàn", "e": "outside"}, {"h": "爸爸", "p": "bà ba", "e": "dad"}, {"h": "大家", "p": "dà jiā", "e": "everyone"}, {"h": "不会", "p": "bú huì", "e": "can't / don't know how"}, {"h": "时候", "p": "shí hou", "e": "time / when"}, {"h": "哪里", "p": "nǎ lǐ", "e": "where"}, {"h": "她们", "p": "tā men", "e": "they (girls)"}, {"h": "很好", "p": "hěn hǎo", "e": "very good"}, {"h": "老师", "p": "lǎo shī", "e": "teacher"}, {"h": "因为", "p": "yīn wèi", "e": "because"}, {"h": "后面", "p": "hòu miàn", "e": "at back / behind"}, {"h": "来到", "p": "lái dào", "e": "to arrive"}, {"h": "也好", "p": "yě hǎo", "e": "too / also"}, {"h": "快乐", "p": "kuài lè", "e": "happy"}, {"h": "可以", "p": "kě yǐ", "e": "can / may"}, {"h": "这里", "p": "zhè lǐ", "e": "here"}, {"h": "好玩", "p": "hǎo wán", "e": "fun"}, {"h": "什么", "p": "shén me", "e": "what"}, {"h": "下雪", "p": "xià xuě", "e": "snowing"}, {"h": "前面", "p": "qián miàn", "e": "in front"}, {"h": "回家", "p": "huí jiā", "e": "go home"}, {"h": "帮助", "p": "bāng zhù", "e": "to help"}, {"h": "好吗", "p": "hǎo ma", "e": "okay?"}, {"h": "跟着", "p": "gēn zhe", "e": "to follow"}, {"h": "说话", "p": "shuō huà", "e": "talking / language"}, {"h": "对不起", "p": "duì bu qǐ", "e": "sorry"}, {"h": "放学", "p": "fàng xué", "e": "go home / leave school"}, {"h": "不能", "p": "bù néng", "e": "not able to"}, {"h": "高兴", "p": "gāo xìng", "e": "glad / happy"}, {"h": "每天", "p": "měi tiān", "e": "every day"}]}]}</script><script id="app">
const $=s=>document.querySelector(s);
const root=$('#root');
let data=JSON.parse($('#data').textContent);
let canEdit=false,cur=0,order=[],i=0,flip=false,mode='h',known={},msg='';
let sample=null,imgCaps=null,pics=[],draftName='',draftText='',panel=false,target='new',diag='';
try{known=JSON.parse(localStorage.getItem('known')||'{}')}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=()=>{const mkw=s=>s.words.map(w=>({...w,_s:s.name}));if(cur>=0)return data.sets[cur]?mkw(data.sets[cur]):[];const seen=new Set();return data.sets.flatMap(mkw).filter(w=>!seen.has(w.h)&&seen.add(w.h))};
const key=w=>(w._s+'|'+w.h);
function mk(shuffle){order=words().map((_,k)=>k);if(shuffle)for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=0;flip=false}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function build(){return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mandarin Practice</title><style id="css">'+$('#css').textContent+'</style></head><body><div id="root"></div><script type="application/json" id="data">'+JSON.stringify(data).replace(/</g,'\\u003c')+'</'+'script><script id="app">'+$('#app').textContent+'</'+'script></body></html>'}
async function pub(){
  try{const a=await claude.use('artifact');if(!a){msg='Publishing is not available here.';render();return}
    await a.publish(build())}catch(e){msg='Could not save: '+(e&&e.message||e);render()}
}
function render(){
  const ws=words(),w=ws[order[i]];
  let h='<h1>🀄 Mandarin Practice</h1>';
  h+='<select id="sel" style="width:100%"><option value="all"'+(cur<0?' selected':'')+'>All sets ('+new Set(data.sets.flatMap(s=>s.words.map(w=>w.h))).size+')</option>'+data.sets.map((s,k)=>'<option value="'+k+'"'+(k==cur?' selected':'')+'>'+esc(s.name)+' ('+s.words.length+')</option>').join('')+'</select>';
  if(w){
    const kn=ws.filter(x=>known[key(x)]).length;
    h+='<div class="prog">Card '+(i+1)+' of '+ws.length+' · '+kn+' known</div>';
    const front=mode=='h'?'<div class="big">'+esc(w.h)+'</div>':'<div class="mid">'+esc(w.e)+'</div>';
    const back=mode=='h'?'<div class="py">'+esc(w.p)+'</div><div class="mid">'+esc(w.e)+'</div>':'<div class="big">'+esc(w.h)+'</div><div class="py">'+esc(w.p)+'</div>';
    h+='<div class="card" id="card">'+(flip?back:front)+'<div class="hint">'+(flip?'':'tap to flip')+'</div></div>';
    h+='<div class="row"><button id="spk">🔊 Listen</button><button id="mode">'+(mode=='h'?'汉字 → English':'English → 汉字')+'</button><button id="shuf">🔀 Shuffle</button></div>';
    h+='<div class="row"><button class="again" id="again">Again</button><button class="ok" id="got">Got it ✓</button></div>';
  }else h+='<p>No words yet.</p>';
  if(canEdit){
    const isNew=target==='new',cn=cur>=0&&data.sets[cur]?data.sets[cur].name:'';
    h+='<details id="dt"'+(panel?' open':'')+'><summary>Add or manage sets (parent)</summary>'
     +'<p class="sm">Add words to:</p><select id="tg" style="width:100%"><option value="new"'+(isNew?' selected':'')+'>A new set</option>'+data.sets.map((s,k)=>'<option value="'+k+'"'+(!isNew&&+target==k?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'
     +(isNew?'<input id="nm" style="margin-top:8px" placeholder="New set name, e.g. Week 5 animals" value="'+esc(draftName)+'">':'')
     +(sample&&imgCaps?'<p class="sm">Pick the front and back photos of one page, then press Read photos. Repeat for each page: the words pile up below.</p><input type="file" id="pic" accept="'+imgCaps.mediaTypes.join(',')+'" multiple><div class="row"><button id="scan">📷 Read photos</button></div>':'<p class="sm">Photo scan unavailable: '+esc(diag||'still checking...')+'</p>')
     +'<p class="sm">Words, one per line: 汉字, pinyin, English</p><textarea id="tx" placeholder="狗, gǒu, dog">'+esc(draftText)+'</textarea>'
     +'<div class="row"><button id="add">'+(isNew?'Create set &amp; publish':'Add to set &amp; publish')+'</button></div>'
     +(cur<0?'<p class="sm" style="margin-top:22px">To rename or delete a set, pick that set in the list at the top.</p>':'<p class="sm" style="margin-top:22px">Currently showing: '+esc(cn)+'</p><input id="rn" value="'+esc(cn)+'"><div class="row"><button id="ren">Rename set</button>'+(data.sets.length>1?'<button id="del">Delete set</button>':'')+'</div>')+'<div class="sm" id="st">'+esc(msg)+'</div></details>';
  }
  root.innerHTML=h;
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  $('#sel').onchange=e=>{cur=e.target.value==='all'?-1:+e.target.value;mk(false);render()};
  on('card',()=>{flip=!flip;render()});
  on('spk',()=>speak(w.h));
  on('mode',()=>{mode=mode=='h'?'e':'h';flip=false;render()});
  on('shuf',()=>{mk(true);render()});
  const next=()=>{i=(i+1)%ws.length;flip=false;render()};
  on('again',()=>{delete known[key(w)];saveKnown();next()});
  on('got',()=>{known[key(w)]=1;saveKnown();next()});
  const dt=$('#dt');
  if(dt){dt.ontoggle=()=>{panel=dt.open};$('#tg').onchange=e=>{target=e.target.value;render()};const nm=$('#nm');if(nm)nm.oninput=e=>{draftName=e.target.value};$('#tx').oninput=e=>{draftText=e.target.value};
    const pc=$('#pic');if(pc)pc.onchange=e=>{pics=[...e.target.files];st(pics.length?pics.length+' photo(s) chosen':'')};on('scan',scan)}
  on('add',()=>{
    const ws2=[];
    $('#tx').value.split('\n').forEach(l=>{const m=l.match(/^(.+?)\s*[,，\t|]\s*(.+?)\s*[,，\t|]\s*(.+)$/);if(m)ws2.push({h:m[1].trim(),p:m[2].trim(),e:m[3].trim()})});
    const isNew=target==='new',name=isNew?$('#nm').value.trim():'';
    if(!ws2.length||(isNew&&!name)){st(isNew?'Add a set name and at least one line like: 狗, gǒu, dog':'Add at least one line like: 狗, gǒu, dog');return}
    if(isNew){if(data.sets.some(x=>x.name===name)){st('A set with that name already exists.');return}data.sets.push({name,words:ws2})}
    else{const t=data.sets[+target];ws2.forEach(w=>{if(!t.words.some(x=>x.h===w.h))t.words.push(w)})}
    pub();
  });
  on('ren',()=>{
    const n=$('#rn').value.trim(),old=data.sets[cur].name;
    if(!n||n===old)return;
    if(data.sets.some((x,k)=>k!=cur&&x.name===n)){st('Another set already has that name.');return}
    const nk={};Object.keys(known).forEach(k=>{nk[k.startsWith(old+'|')?n+k.slice(old.length):k]=known[k]});known=nk;saveKnown();
    data.sets[cur].name=n;pub();
  });
  on('del',()=>{if(confirm('Delete "'+data.sets[cur].name+'"?')){data.sets.splice(cur,1);pub()}});
}
function st(t){msg=t;const e=$('#st');if(e)e.textContent=t}
const ERR={not_granted:'Scanning needs permission to use Claude. You can still type words in.',sampling_disabled:'Scanning is not available on this account. You can still type words in.',image_rejected:'I could not open those photos. Try JPG or PNG.',rate_limited:'Too many requests right now. Try again in a bit.',invalid_json:'I could not read that clearly. Try again with brighter, flatter photos.',refused:'I could not read those photos. Try different ones.'};
const PROMPT='These photos show both sides of a printed Mandarin flashcard sheet laid out as a grid of cards. The FRONT shows Chinese characters (sometimes with handwritten English notes or doodles); the BACK shows the pinyin. The back is printed mirrored for double-sided printing, so a card\'s pinyin sits in the OPPOSITE column of the same row from its characters (swap left and right within each row). Pair every card\'s characters with its pinyin, keeping tone marks exactly as printed. For English give a short meaning: use the handwritten English if present, otherwise your own concise translation. Ignore names and doodles. Reply with only a JSON array in reading order of the front (left to right, top to bottom), like [{"h":"上面","p":"shàng miàn","e":"above"}].';
async function scan(){
  if(!pics.length){st('Choose the front and back photos first.');return}
  st('Reading the photos... this can take up to a minute.');
  try{
    const r=await sample.json(PROMPT,{images:pics.slice(0,imgCaps.maxCount),cache:false});
    if(!Array.isArray(r)||!r.length)throw {code:'invalid_json'};
    const add=r.map(w=>[w.h,w.p,w.e].join(', ')).join('\n');draftText=(draftText.trim()?draftText.trim()+'\n':'')+add;pics=[];panel=true;render();
    st('Added '+r.length+' words below. Check them, then pick the next page\'s photos or save at the bottom.');
  }catch(e){st(ERR[e&&e.code]||'Something went wrong. Please try again.')}
}
function saveKnown(){try{localStorage.setItem('known',JSON.stringify(known))}catch(e){}}
mk(false);render();
</script></body></html>
