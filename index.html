<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<title>Mandarin Practice</title>
<style>
:root{--bg:#fdf8f0;--card:#fff;--ink:#2a2420;--mute:#7a6f66;--acc:#d9422b;--ok:#2f8f5b;--line:#e8dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--ink:#f5efe6;--mute:#a8a29e;--acc:#ff7a5c;--ok:#5fcf93;--line:#44403c}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--ink:#f5efe6;--mute:#a8a29e;--acc:#ff7a5c;--ok:#5fcf93;--line:#44403c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
#root{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 14px}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row>*{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.big{font-size:4.5rem;line-height:1.1}
.mid{font-size:2rem}
.py{font-size:1.8rem;color:var(--acc);margin-top:10px}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.again{border-color:var(--acc);color:var(--acc)}
.prog{color:var(--mute);font-size:.9rem;margin:10px 0;text-align:center}
.nav{display:flex;align-items:center;justify-content:center;gap:28px;margin:14px 0 4px;color:var(--mute);font-size:.95rem}
.arr{background:none;border:none;font-size:1.6rem;line-height:1;padding:6px 14px;color:var(--mute);border-radius:999px}
.arr:hover:not(:disabled){background:var(--line)}
.arr:disabled{opacity:.3}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--mute)}
.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:.8rem}
.hz{font-size:1.3rem}
</style></head>
<body><div id="root"></div>
<script type="application/json" id="data">{"sets": [{"name": "Set 1", "words": [{"h": "上面", "p": "shàng miàn", "e": "above / on top"}, {"h": "不好", "p": "bù hǎo", "e": "not good"}, {"h": "大山", "p": "dà shān", "e": "big mountain"}, {"h": "小马", "p": "xiǎo mǎ", "e": "small horse"}, {"h": "男生", "p": "nán shēng", "e": "boy"}, {"h": "月亮", "p": "yuè liang", "e": "moon"}, {"h": "今天", "p": "jīn tiān", "e": "today"}, {"h": "走路", "p": "zǒu lù", "e": "to walk"}, {"h": "星星", "p": "xīng xing", "e": "star"}, {"h": "下面", "p": "xià miàn", "e": "below"}, {"h": "坐下", "p": "zuò xià", "e": "sit down"}, {"h": "喝水", "p": "hē shuǐ", "e": "drink water"}, {"h": "小牛", "p": "xiǎo niú", "e": "calf"}, {"h": "女生", "p": "nǚ shēng", "e": "girl"}, {"h": "是的", "p": "shì de", "e": "yes"}, {"h": "出去", "p": "chū qù", "e": "go out"}, {"h": "星期", "p": "xīng qī", "e": "week"}, {"h": "大小", "p": "dà xiǎo", "e": "big / small"}, {"h": "现在", "p": "xiàn zài", "e": "now"}, {"h": "大火", "p": "dà huǒ", "e": "big fire"}, {"h": "小羊", "p": "xiǎo yáng", "e": "lamb"}, {"h": "生日", "p": "shēng rì", "e": "birthday"}, {"h": "下雨", "p": "xià yǔ", "e": "rain"}, {"h": "明天", "p": "míng tiān", "e": "tomorrow"}, {"h": "回来", "p": "huí lái", "e": "to come back"}, {"h": "几个", "p": "jǐ ge", "e": "how many"}, {"h": "里面", "p": "lǐ miàn", "e": "inside"}, {"h": "大人", "p": "dà rén", "e": "adult"}, {"h": "小鸟", "p": "xiǎo niǎo", "e": "small bird"}, {"h": "土地", "p": "tǔ dì", "e": "ground"}, {"h": "学生", "p": "xué sheng", "e": "student"}, {"h": "昨天", "p": "zuó tiān", "e": "yesterday"}, {"h": "田地", "p": "tián dì", "e": "farm land"}, {"h": "今年", "p": "jīn nián", "e": "this year"}, {"h": "小虫", "p": "xiǎo chóng", "e": "small bug"}]}, {"name": "Set 2", "words": [{"h": "我们", "p": "wǒ men", "e": "we"}, {"h": "朋友", "p": "péng you", "e": "friend"}, {"h": "不要", "p": "bú yào", "e": "don't want"}, {"h": "喜欢", "p": "xǐ huan", "e": "to like"}, {"h": "上课", "p": "shàng kè", "e": "to have class"}, {"h": "没有", "p": "méi yǒu", "e": "don't have"}, {"h": "送给", "p": "sòng gěi", "e": "to give someone"}, {"h": "学生", "p": "xué sheng", "e": "student"}, {"h": "怎么", "p": "zěn me", "e": "how"}, {"h": "几岁", "p": "jǐ suì", "e": "how old"}, {"h": "你们", "p": "nǐ men", "e": "you (plural)"}, {"h": "上面", "p": "shàng miàn", "e": "above / on top"}, {"h": "看书", "p": "kàn shū", "e": "to read"}, {"h": "妈妈", "p": "mā ma", "e": "mom"}, {"h": "学校", "p": "xué xiào", "e": "school"}, {"h": "是谁", "p": "shì shéi", "e": "who is it"}, {"h": "时间", "p": "shí jiān", "e": "time"}, {"h": "你好", "p": "nǐ hǎo", "e": "hello"}, {"h": "我的", "p": "wǒ de", "e": "my"}, {"h": "他们", "p": "tā men", "e": "they (boys / mixed)"}, {"h": "吃饭", "p": "chī fàn", "e": "to eat"}, {"h": "外面", "p": "wài miàn", "e": "outside"}, {"h": "爸爸", "p": "bà ba", "e": "dad"}, {"h": "大家", "p": "dà jiā", "e": "everyone"}, {"h": "不会", "p": "bú huì", "e": "can't / don't know how"}, {"h": "时候", "p": "shí hou", "e": "time / when"}, {"h": "哪里", "p": "nǎ lǐ", "e": "where"}, {"h": "她们", "p": "tā men", "e": "they (girls)"}, {"h": "很好", "p": "hěn hǎo", "e": "very good"}, {"h": "老师", "p": "lǎo shī", "e": "teacher"}, {"h": "因为", "p": "yīn wèi", "e": "because"}, {"h": "后面", "p": "hòu miàn", "e": "at back / behind"}, {"h": "来到", "p": "lái dào", "e": "to arrive"}, {"h": "也好", "p": "yě hǎo", "e": "too / also"}, {"h": "快乐", "p": "kuài lè", "e": "happy"}, {"h": "可以", "p": "kě yǐ", "e": "can / may"}, {"h": "这里", "p": "zhè lǐ", "e": "here"}, {"h": "好玩", "p": "hǎo wán", "e": "fun"}, {"h": "什么", "p": "shén me", "e": "what"}, {"h": "下雪", "p": "xià xuě", "e": "snowing"}, {"h": "前面", "p": "qián miàn", "e": "in front"}, {"h": "回家", "p": "huí jiā", "e": "go home"}, {"h": "帮助", "p": "bāng zhù", "e": "to help"}, {"h": "好吗", "p": "hǎo ma", "e": "okay?"}, {"h": "跟着", "p": "gēn zhe", "e": "to follow"}, {"h": "说话", "p": "shuō huà", "e": "talking / language"}, {"h": "对不起", "p": "duì bu qǐ", "e": "sorry"}, {"h": "放学", "p": "fàng xué", "e": "go home / leave school"}, {"h": "不能", "p": "bù néng", "e": "not able to"}, {"h": "高兴", "p": "gāo xìng", "e": "glad / happy"}, {"h": "每天", "p": "měi tiān", "e": "every day"}]}]}</script>
<script>
const $=s=>document.querySelector(s);
const root=$('#root');
const data=JSON.parse($('#data').textContent);
let cur=-1,order=[],i=0,flip=false,mode='h',got=new Set(),round=1,done=false,listOpen=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=()=>{
  if(cur>=0)return data.sets[cur]?data.sets[cur].words:[];
  const seen=new Set();
  return data.sets.flatMap(s=>s.words).filter(w=>!seen.has(w.h)&&seen.add(w.h));
};
function mk(shuffle){
  order=words().map((_,k)=>k);
  if(shuffle)for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}
  i=0;flip=false;got=new Set();round=1;done=false;
}
function advance(){
  flip=false;
  if(i<order.length-1){i++;return}
  const rem=order.filter(k=>!got.has(k));
  if(!rem.length){done=true;return}
  order=rem;round++;i=0;
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function render(){
  const ws=words(),w=ws[order[i]];
  let h='<h1>🀄 Mandarin Practice</h1>';
  h+='<select id="sel" style="width:100%"><option value="all"'+(cur<0?' selected':'')+'>All sets ('+new Set(data.sets.flatMap(s=>s.words.map(x=>x.h))).size+')</option>'+data.sets.map((s,k)=>'<option value="'+k+'"'+(k==cur?' selected':'')+'>'+esc(s.name)+' ('+s.words.length+')</option>').join('')+'</select>';
  if(done){
    h+='<div class="card" style="cursor:default"><div class="big">🎉</div><div class="mid" style="margin-top:12px">You got them all!</div><div class="hint">'+(round>1?'Finished in '+round+' rounds':'First try!')+'</div></div><div class="row"><button class="ok" id="again2">Practice again</button><button id="shuf2">🔀 Shuffle &amp; restart</button></div>';
  }else if(w){
    h+='<div class="row"><button id="spk">🔊 Listen</button><button id="mode">'+(mode=='h'?'汉字 → English':'English → 汉字')+'</button><button id="shuf">🔀 Shuffle</button></div>';
    const front=mode=='h'?'<div class="big">'+esc(w.h)+'</div>':'<div class="mid">'+esc(w.e)+'</div>';
    const back=mode=='h'?'<div class="py">'+esc(w.p)+'</div><div class="mid">'+esc(w.e)+'</div>':'<div class="big">'+esc(w.h)+'</div><div class="py">'+esc(w.p)+'</div>';
    h+='<div class="card" id="card">'+(flip?back:front)+'<div class="hint">'+(flip?'':'tap to flip')+'</div></div>';
    h+='<div class="nav"><button class="arr" id="back" aria-label="Previous card"'+(i==0?' disabled':'')+'>←</button><span>'+(i+1)+' / '+order.length+'</span><button class="arr" id="next" aria-label="Next card">→</button></div>';
    h+='<div class="row"><button class="again" id="pass">Pass</button><button class="ok" id="got">Got it ✓</button></div>';
    h+='<div class="prog">'+(round>1?'Round '+round+' (retrying passed cards) · ':'')+got.size+'/'+ws.length+' got it</div>';
  }else h+='<p>No words yet.</p>';
  h+='<details id="ls"'+(listOpen?' open':'')+'><summary>Word list ('+ws.length+' words)</summary><div class="tw"><table><thead><tr><th>汉字</th><th>Pinyin</th><th>English</th></tr></thead><tbody>'
    +ws.map(x=>'<tr><td class="hz">'+esc(x.h)+'</td><td>'+esc(x.p)+'</td><td>'+esc(x.e)+'</td></tr>').join('')
    +'</tbody></table></div></details>';
  root.innerHTML=h;
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  $('#sel').onchange=e=>{cur=e.target.value==='all'?-1:+e.target.value;mk(false);render()};
  const ls=$('#ls');ls.ontoggle=()=>{listOpen=ls.open};
  on('card',()=>{flip=!flip;render()});
  on('spk',()=>speak(w.h));
  on('mode',()=>{mode=mode=='h'?'e':'h';flip=false;render()});
  on('shuf',()=>{mk(true);render()});
  on('back',()=>{if(i>0){i--;flip=false;render()}});
  on('next',()=>{advance();render()});
  on('pass',()=>{got.delete(order[i]);advance();render()});
  on('got',()=>{got.add(order[i]);advance();render()});
  on('again2',()=>{mk(false);render()});
  on('shuf2',()=>{mk(true);render()});
}
mk(false);render();
</script></body></html>
